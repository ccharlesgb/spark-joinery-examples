[project]
name = "spark-joinery-examples"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "spark-joinery>=0.0.3",
]

[dependency-groups]
dev = [
    "library-skills>=0.0.19",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.workspace]
members = ["order_product", "customer_group", "snapshot_diff"]
