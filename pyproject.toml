[project]
name = "spark-joinery-examples"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "spark-joinery>=0.0.3",
]

[dependency-groups]
dev = [
    "library-skills>=0.0.19",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["./*/tests"] 

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = [
    "order_product/src",
    "snapshot_diff/src",
    "customer_group/src",
    "housing_linear_regression/src",
]

[tool.uv.workspace]
members = [
    "customer_group_example",
    "order_product_example",
    "snapshot_diff_example",
    "housing_linear_regression_example"
]